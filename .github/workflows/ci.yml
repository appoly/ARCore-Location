name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew :arcore-location:lintRelease :arcore-location-sceneform:lintRelease :example:lintDebug

      - name: Build libraries and example
        run: ./gradlew :arcore-location:assembleRelease :arcore-location-sceneform:assembleRelease :example:assembleDebug

      - name: Publish to Maven local (as JitPack does)
        run: ./gradlew :arcore-location:publishToMavenLocal :arcore-location-sceneform:publishToMavenLocal

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '**/build/reports/'
